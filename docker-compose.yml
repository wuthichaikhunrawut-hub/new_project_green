services:
  frontend:
    image: green-office-frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: green_frontend
    restart: always
    ports:
      - "4000:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.angular
      - /app/dist
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=250
      - NG_CLI_ANALYTICS=ci
      - WATCH=true
      - NODE_ENV=development
      - NG_BUILD_OPTIMIZER=false
    healthcheck:
      test: ["CMD", "node", "-e", "const req = require('http').request('http://localhost:4200/', { method: 'GET', timeout: 2000 }, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.end();"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: npm start -- --host 0.0.0.0 --poll 250 --watch --live-reload
