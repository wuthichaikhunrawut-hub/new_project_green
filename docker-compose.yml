services:
  postgres:
    image: postgres:16
    container_name: green_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: greenoffice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  pgadmin:
    image: dpage/pgadmin4
    container_name: green_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: green_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: 1234
      DB_NAME: greenoffice
      SUPABASE_URL: ${SUPABASE_URL:-https://bhtimppbjwycefsmqqqt.supabase.co}
      SUPABASE_KEY: ${SUPABASE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJodGltcHBiand5Y2Vmc21xcXF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNDc0MzMsImV4cCI6MjA5MzcyMzQzM30.RnXr1bH4K7TKbygRTv9UrxhcJL6wmy9YZ6A52-X3gKo}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-greensync-storage}
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: green-office-frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: green_frontend
    restart: always
    ports:
      - "4000:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.angular
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=250
      - NG_CLI_ANALYTICS=ci
      - WATCH=true
      - NODE_ENV=development
      - NG_BUILD_OPTIMIZER=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: npm start -- --host 0.0.0.0 --poll 250 --watch --live-reload
    depends_on:
      - backend

volumes:
  postgres_data:
  pgadmin_data:
