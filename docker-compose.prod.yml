services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: npm run start:prod
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_SYNCHRONIZE=false
      - ENABLE_SWAGGER=${ENABLE_SWAGGER:-false}
      - JWT_SECRET=${JWT_SECRET}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET:-greensync-storage}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
    # No volume mount for source code to ensure compiled code is used
    networks:
      - green_sync_network
    healthcheck:
      test: ["CMD", "node", "-e", "const req=require('http').get('http://localhost:3001/health',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=production
    networks:
      - green_sync_network
    depends_on:
      backend:
        condition: service_healthy

networks:
  green_sync_network:
    driver: bridge
