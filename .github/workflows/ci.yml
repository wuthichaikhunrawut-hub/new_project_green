name: GreenSync CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: |
          backend/package-lock.json
          frontend/package-lock.json

    - name: Install Dependencies (Backend)
      working-directory: ./backend
      run: npm ci

    - name: Build Backend
      working-directory: ./backend
      run: npm run build

    - name: Validate Production Configuration Contract
      working-directory: ./backend
      env:
        NODE_ENV: production
        DB_SYNCHRONIZE: 'false'
        DB_HOST: database.internal
        DB_PORT: '5432'
        DB_USERNAME: greensync_ci
        DB_PASSWORD: ci-only-not-a-real-secret
        DB_NAME: greenoffice_ci
        JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
        ALLOWED_ORIGINS: https://app.example.test
        GEMINI_API_KEY: ci-only-gemini-key
        SUPABASE_URL: https://example.supabase.co
        SUPABASE_KEY: ci-only-supabase-key
        SMTP_HOST: smtp.example.test
        SMTP_USER: ci@example.test
        SMTP_PASS: ci-only-smtp-password
      run: npm run preflight:production

    - name: Lint Backend
      working-directory: ./backend
      run: npm run lint

    - name: Test Backend
      working-directory: ./backend
      run: npm test -- --runInBand

    - name: Test Backend HTTP Contracts
      working-directory: ./backend
      run: npm run test:e2e -- --runInBand

    - name: Install Dependencies (Frontend)
      working-directory: ./frontend
      run: npm ci --legacy-peer-deps

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build -- --configuration production

    - name: Test Frontend with Coverage
      working-directory: ./frontend
      run: npm run test:coverage -- --watch=false

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker Compose Services
      run: docker compose -f docker-compose.prod.yml build

  deploy:
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Deploy to Production via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /opt/project-green
          git pull origin main
          docker-compose -f docker-compose.prod.yml down
          docker-compose -f docker-compose.prod.yml up -d --build
