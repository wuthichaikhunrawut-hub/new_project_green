<header class="top-navbar border-bottom px-4 d-flex align-items-center justify-content-between">
  <div class="d-flex align-items-center">
    <button class="btn-toggle me-3" (click)="toggleSidebar()">
      <i class="fa-solid fa-bars-staggered"></i>
    </button>
    <nav aria-label="breadcrumb" class="d-none d-md-block">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item active" aria-current="page">
          <span class="text-muted fw-medium">
            <ng-container *ngIf="role === 'SYSTEM_ADMIN' || role === 'ADMIN' || role === 'System Admin'">System Admin Portal</ng-container>
            <ng-container *ngIf="role === 'ASSESSOR' || role === 'Assessor'">Assessor Portal</ng-container>
            <ng-container *ngIf="role === 'ORG_ADMIN' || role === 'Organization Admin'">Organization Admin Portal</ng-container>
            <ng-container *ngIf="!['SYSTEM_ADMIN', 'ADMIN', 'System Admin', 'ASSESSOR', 'Assessor', 'ORG_ADMIN', 'Organization Admin'].includes(role)">Applicant Portal</ng-container>
          </span>
        </li>
      </ol>
    </nav>
  </div>

  <div class="top-actions d-flex align-items-center gap-3">
    <div class="quota-info d-none d-lg-block">
      <span class="badge rounded-pill bg-light text-dark border px-3 py-2 fw-medium text-muted"
            title="โควต้าการใช้เครื่องมือ AI วิเคราะห์ข้อมูล (ใช้ไป 12 จาก 50 ครั้ง) รีเซ็ตทุกเดือน">
        <i class="fa-solid fa-bolt text-amber-500 me-1"></i> AI Usage: 12/50
      </span>
    </div>
    <button
      class="btn-icon position-relative border-0 bg-transparent text-secondary p-2 rounded-circle hover-bg-light transition-all"
      [routerLink]="['/notifications']">
      <i class="fa-solid fa-bell fs-5"></i>
      <span *ngIf="unreadNotifications > 0" 
        class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
        style="font-size: 0.65rem;">
        {{ unreadNotifications > 99 ? '99+' : unreadNotifications }}
      </span>
    </button>
  </div>
</header>
