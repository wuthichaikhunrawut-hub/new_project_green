<div class="max-w-4xl space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">จัดการสาขาและแผนก</h1>
      <p class="text-slate-500 mt-1 text-sm">เพิ่มลบ หรือจัดการหน่วยงานย่อยภายในองค์กรของคุณ</p>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
    <h2 class="text-lg font-semibold text-slate-800 mb-4">เพิ่มสาขาใหม่</h2>
    <div class="flex gap-3">
      <input type="text" [(ngModel)]="newBranchName" placeholder="ชื่อสาขา/แผนก (เช่น สำนักงานใหญ่, สาขาเชียงใหม่)" class="flex-1 form-input rounded-lg border-slate-300 px-4 py-2 border outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500">
      <button (click)="addBranch()" [disabled]="!newBranchName.trim()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-lg font-medium transition-colors disabled:opacity-50">
        <i class="fa-solid fa-plus mr-2"></i>เพิ่มสาขา
      </button>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-slate-50 text-slate-600 text-sm border-b border-slate-200">
          <th class="py-3 px-6 font-medium">ลำดับ</th>
          <th class="py-3 px-6 font-medium">ชื่อสาขา/แผนก</th>
          <th class="py-3 px-6 font-medium text-right">จัดการ</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="isLoading">
          <td colspan="3" class="py-8 text-center text-slate-400">กำลังโหลด...</td>
        </tr>
        <tr *ngIf="!isLoading && branches.length === 0">
          <td colspan="3" class="py-8 text-center text-slate-400">ยังไม่มีข้อมูลสาขา</td>
        </tr>
        <tr *ngFor="let branch of branches; let i = index" class="border-b border-slate-100 last:border-0 hover:bg-slate-50">
          <td class="py-3 px-6 text-slate-500">{{ i + 1 }}</td>
          <td class="py-3 px-6 text-slate-800 font-medium">{{ branch.unit_name }}</td>
          <td class="py-3 px-6 text-right">
            <button (click)="deleteBranch(branch.id!)" class="text-rose-500 hover:text-rose-700 p-2 transition-colors" title="ลบสาขา">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
