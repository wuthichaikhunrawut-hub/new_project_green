<div class="max-w-5xl mx-auto space-y-6">
  <header>
    <h1 class="text-2xl font-bold text-slate-900">ประวัติการประเมิน</h1>
    <p class="text-sm text-slate-500 mt-1">คำขอที่ปิดงานแล้ว (อนุมัติ / ปฏิเสธ)</p>
  </header>

  @if (isLoading) {
    <div class="flex justify-center py-16"><div class="h-10 w-10 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div></div>
  } @else if (history.length === 0) {
    <p class="text-center text-slate-500 py-16 text-sm">ยังไม่มีประวัติ</p>
  } @else {
    <div class="rounded-2xl border border-slate-200 overflow-hidden bg-white divide-y divide-slate-100">
      @for (item of history; track item.id) {
        <div class="p-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h2 class="font-semibold text-slate-900">{{ item.orgName }}</h2>
            <p class="text-sm text-slate-500">ปี {{ item.assessmentYear }} · {{ statusLabel(item.status) }}</p>
          </div>
          <a [routerLink]="['/assessor/decide', item.id]" class="text-sm font-medium text-emerald-600 hover:text-emerald-700">ดูรายละเอียด →</a>
        </div>
      }
    </div>
  }
</div>
