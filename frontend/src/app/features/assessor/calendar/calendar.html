<div class="min-h-screen bg-gray-50/50 p-6">
  <!-- Header -->
  <header class="mb-8 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-gray-900">Assessment Calendar</h1>
      <p class="text-sm text-gray-500 mt-1">Manage your schedule and on-site visits.</p>
    </div>
    <div class="flex items-center gap-4 bg-white p-1 rounded-lg ring-1 ring-gray-900/5 shadow-sm">
      <button (click)="prevMonth()" class="px-3 py-1.5 text-sm font-medium text-gray-700 hover:text-gray-900 transition-colors">&larr;</button>
      <span class="text-sm font-semibold text-gray-900 px-2">{{ currentMonthName }} {{ currentYear }}</span>
      <button (click)="nextMonth()" class="px-3 py-1.5 text-sm font-medium text-gray-700 hover:text-gray-900 transition-colors">&rarr;</button>
    </div>
  </header>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="flex justify-center items-center py-20">
    <div class="loader ease-linear rounded-full border-4 border-t-4 border-emerald-500 h-12 w-12 border-t-transparent animate-spin"></div>
  </div>

  <div *ngIf="!isLoading" class="rounded-xl bg-white shadow-sm ring-1 ring-gray-900/5 overflow-hidden">
    <!-- Calendar Grid Header -->
    <div class="grid grid-cols-7 border-b border-gray-200 bg-gray-50 text-center text-xs font-semibold leading-6 text-gray-700">
      <div class="py-2">Mon</div>
      <div class="py-2">Tue</div>
      <div class="py-2">Wed</div>
      <div class="py-2">Thu</div>
      <div class="py-2">Fri</div>
      <div class="py-2">Sat</div>
      <div class="py-2">Sun</div>
    </div>
    
    <!-- Calendar Days -->
    <div class="grid grid-cols-7 gap-px bg-gray-250">
      <div *ngFor="let day of calendarDays" 
           class="min-h-[120px] bg-white p-2 text-sm flex flex-col justify-between transition-colors hover:bg-slate-50/30"
           [class.bg-slate-50/50]="!day.isCurrentMonth"
           [class.text-gray-400]="!day.isCurrentMonth">
        <div class="flex justify-between items-center mb-1">
          <span [class.font-semibold]="day.isToday" 
                [class.text-emerald-600]="day.isToday">
            {{ day.date.getDate() }}
          </span>
          <span *ngIf="day.isToday" class="text-[9px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded font-bold">Today</span>
        </div>
        
        <!-- Events list for this day -->
        <div class="space-y-1 flex-grow overflow-y-auto max-h-[85px] mt-1 pr-0.5">
          <div *ngFor="let ev of day.events" 
               (click)="viewAssessment(ev.id)"
               class="rounded px-2 py-1 text-xs font-medium shadow-sm cursor-pointer transition-all duration-150 text-left border-l-4"
               [ngClass]="getEventStyles(ev)">
            <div class="truncate font-semibold">{{ ev.title }}</div>
            <div class="text-[9px] opacity-80 mt-0.5 flex items-center justify-between gap-1">
              <span>{{ ev.status }}</span>
              <span *ngIf="!ev.isAssigned" class="text-[8px] px-1 bg-slate-200 rounded text-slate-600">Unassigned</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
