<div class="min-h-screen bg-gray-50/50 p-6">
  <!-- Header -->

    <div>
      <h1 class="text-2xl font-bold tracking-tight text-gray-900">Assessment Calendar</h1>
      <p class="text-sm text-gray-500 mt-1">Manage your schedule and on-site visits.</p>
    </div>
    <div class="flex items-center gap-4 bg-white p-1 rounded-lg ring-1 ring-gray-900/5 shadow-sm">

      <div class="py-2">Fri</div>

      <div class="py-2">Sun</div>
    </div>
