<div class="container-fluid p-4 animate-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1 text-primary"><i class="fa-solid fa-bell me-2"></i>การแจ้งเตือน</h2>
            <p class="text-muted mb-0">คำขอใหม่ และ Deadline ที่ใกล้ถึง</p>
        </div>
        <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" (click)="markAllRead()" [disabled]="unreadCount === 0 || isLoading">
            <i class="fa-solid fa-check-double me-1"></i>อ่านทั้งหมด
        </button>
    </div>

    <!-- Filter Tabs -->
    <ul class="nav nav-pills mb-4 bg-white p-2 rounded-pill shadow-sm d-inline-flex">
        <li class="nav-item">
            <button class="nav-link rounded-pill px-4" [class.active]="activeTab === 'all'"
                (click)="activeTab = 'all'">ทั้งหมด</button>
        </li>
        <li class="nav-item">
            <button class="nav-link rounded-pill px-4" [class.active]="activeTab === 'unread'"
                (click)="activeTab = 'unread'">
                ยังไม่ได้อ่าน <span class="badge bg-danger rounded-pill ms-1" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
            </button>
        </li>
    </ul>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <div class="text-muted mt-2">กำลังโหลดการแจ้งเตือน...</div>
    </div>

    <!-- Notification List -->
    <div *ngIf="!isLoading" class="d-flex flex-column gap-3">
        <div *ngFor="let n of filteredNotifications"
            class="card border-0 shadow-sm rounded-4 px-4 py-3 d-flex flex-row gap-4 align-items-start"
            [ngClass]="{'bg-primary bg-opacity-5 border-start border-4 border-primary': !n.is_read}">
            <div class="pt-1" [ngClass]="{
        'text-warning': n.type === 'DEADLINE',
        'text-primary': n.type === 'REQUEST' || n.type === 'ASSESSMENT',
        'text-danger': n.type === 'URGENT',
        'text-info': n.type === 'SYSTEM' || n.type === 'ACCOUNT'
      }">
                <i class="fa-solid fa-2x" [ngClass]="{
          'fa-clock': n.type === 'DEADLINE',
          'fa-file-circle-plus': n.type === 'REQUEST' || n.type === 'ASSESSMENT',
          'fa-triangle-exclamation': n.type === 'URGENT',
          'fa-circle-info': n.type === 'SYSTEM' || n.type === 'ACCOUNT'
        }"></i>
            </div>
            <div class="flex-grow-1 cursor-pointer" (click)="markAsRead(n)">
                <div class="d-flex justify-content-between align-items-start">
                    <div class="fw-bold">{{ n.title }}</div>
                    <div class="small text-muted">{{ formatDate(n.created_at) }}</div>
                </div>
                <div class="text-muted small mb-2">{{ n.message }}</div>
                <button *ngIf="n.link" (click)="$event.stopPropagation(); viewDetails(n)"
                    class="btn btn-sm btn-primary rounded-pill px-3">
                    <i class="fa-solid fa-arrow-right me-1"></i>ดูรายละเอียด
                </button>
            </div>
            <button *ngIf="!n.is_read" class="btn btn-sm btn-light border rounded-circle flex-shrink-0" (click)="$event.stopPropagation(); markAsRead(n)"
                title="ทำเครื่องหมายอ่านแล้ว">
                <i class="fa-solid fa-check fs-7"></i>
            </button>
        </div>

        <div *ngIf="filteredNotifications.length === 0" class="text-center py-5 text-muted">
            <i class="fa-solid fa-bell-slash fs-1 mb-3 d-block opacity-50"></i>
            ไม่มีการแจ้งเตือน
        </div>
    </div>
</div>
