<div class="container-fluid p-4 animate-in">
    <div class="page-header mb-4">
        <div class="page-header-left">
            <h2 class="page-title"><i class="fa-solid fa-bell me-2"></i>การแจ้งเตือน</h2>
            <p class="page-subtitle mb-0">ข้อมูลอัปเดต และประกาศสำคัญของระบบ</p>
        </div>
        <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 shadow-sm bg-white" (click)="markAllRead()">
            <i class="fa-solid fa-check-double me-1"></i>อ่านทั้งหมด
        </button>
    </div>

    <!-- Filter Tabs -->
    <ul class="nav nav-pills mb-4 bg-white p-2 rounded-pill shadow-sm d-inline-flex border">
        <li class="nav-item">
            <button class="nav-link rounded-pill px-4" [class.active]="activeTab === 'all'"
                (click)="activeTab = 'all'">ทั้งหมด</button>
        </li>
        <li class="nav-item">
            <button class="nav-link rounded-pill px-4" [class.active]="activeTab === 'unread'"
                (click)="activeTab = 'unread'">
                ยังไม่ได้อ่าน <span class="badge bg-danger rounded-pill ms-1" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
            </button>
        </li>
    </ul>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <!-- Notification List -->
    <div *ngIf="!isLoading" class="d-flex flex-column gap-3">
        <div *ngFor="let n of filteredNotifications"
            class="card border-0 shadow-sm rounded-4 px-4 py-3 d-flex flex-row gap-4 align-items-start transition-all notification-card"
            [ngClass]="{'unread-bg': !n.is_read}">
            
            <div class="pt-1" [ngClass]="getTypeClass(n.type)">
                <i class="fa-solid fa-2x" [ngClass]="getTypeIcon(n.type)"></i>
            </div>

            <div class="flex-grow-1">
                <div class="d-flex justify-content-between align-items-start">
                    <div class="fw-bold fs-5 mb-1" [class.text-primary]="!n.is_read">{{ n.title }}</div>
                    <div class="small text-muted">{{ n.created_at | date:'dd/MM/yyyy HH:mm' }}</div>
                </div>
                <div class="text-muted mb-3">{{ n.message }}</div>
                
                <div class="d-flex gap-2">
                    <button *ngIf="n.link" (click)="viewDetails(n)"
                        class="btn btn-sm btn-primary rounded-pill px-3">
                        <i class="fa-solid fa-arrow-right me-1"></i>ดูรายละเอียด
                    </button>
                    <button *ngIf="!n.is_read" class="btn btn-sm btn-light border rounded-pill px-3" (click)="markAsRead(n)">
                        <i class="fa-solid fa-check me-1"></i>ทำเครื่องหมายอ่านแล้ว
                    </button>
                </div>
            </div>
            
            <div *ngIf="!n.is_read" class="unread-dot"></div>
        </div>

        <div *ngIf="filteredNotifications.length === 0" class="text-center py-5 text-muted bg-white rounded-4 shadow-sm border border-dashed">
            <i class="fa-solid fa-bell-slash fs-1 mb-3 d-block opacity-25"></i>
            <p class="mb-0">ไม่มีการแจ้งเตือนในขณะนี้</p>
        </div>
    </div>
</div>
