<!-- Floating Toggle Button -->
<button class="chat-fab" (click)="toggleChat()" [class.open]="isOpen" title="GreenBot AI Assistant">
  <i class="fa-solid" [ngClass]="isOpen ? 'fa-xmark' : 'fa-robot'"></i>
  <span class="chat-fab-pulse" *ngIf="!isOpen"></span>
</button>

<!-- Chat Panel -->
<div class="chat-panel" [class.open]="isOpen" [style.width.px]="chatWidth" [style.height.px]="chatHeight">
  
  <!-- Resize Handles -->
  <div class="resize-handle resize-top" (mousedown)="onResizeStart($event, 'top')"></div>
  <div class="resize-handle resize-left" (mousedown)="onResizeStart($event, 'left')"></div>
  <div class="resize-handle resize-top-left" (mousedown)="onResizeStart($event, 'top-left')"></div>

  <!-- Header -->
  <div class="chat-header">
    <div class="chat-header-info">
      <button class="chat-history-toggle" (click)="toggleHistory()" title="ประวัติการสนทนา">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="chat-avatar bg-white p-[2px]">
        <img src="/assets/images/greenbot.png" alt="GreenBot" class="w-100 h-100 rounded-circle object-fit-cover">
      </div>
      <div>
        <p class="chat-title">GreenBot</p>
        <p class="chat-subtitle">AI ผู้ช่วยด้านสิ่งแวดล้อม</p>
      </div>
    </div>
    <button class="chat-clear-btn" (click)="startNewChat()" title="เริ่มบทสนทนาใหม่">
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>

  <!-- History Drawer -->
  <div class="chat-history-drawer" [class.open]="showHistory">
    <div class="drawer-header">
      <span class="font-bold text-sm text-slate-800">ประวัติการสนทนา</span>
      <button (click)="toggleHistory()" class="text-slate-400 hover:text-slate-600 transition-colors">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="drawer-content">
      <div *ngIf="sessions.length === 0" class="text-center text-slate-400 text-xs py-4">
        ไม่มีประวัติการสนทนา
      </div>
      <div *ngFor="let s of sessions" 
           class="history-item" 
           [class.active]="s.id === activeSessionId"
           (click)="selectSession(s)">
        <i class="fa-regular fa-message mr-2"></i>
        <span>{{ s.title }}</span>
      </div>
    </div>
    <div class="drawer-footer">
      <button class="clear-history-btn" (click)="clearChat()">
        <i class="fa-solid fa-trash-can mr-2"></i> ลบประวัติทั้งหมด
      </button>
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-messages">
    <div *ngFor="let msg of messages" class="chat-message-wrapper" [ngClass]="msg.role">
      <div class="chat-bubble" [ngClass]="msg.role">
        <p>{{ msg.text }}</p>
      </div>
    </div>

    <!-- Loading indicator -->
    <div *ngIf="isLoading" class="chat-message-wrapper bot">
      <div class="chat-bubble bot loading-bubble">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="chat-input-area">
    <textarea
      class="chat-input"
      rows="1"
      [(ngModel)]="inputMessage"
      (keydown)="onKeyEnter($event)"
      placeholder="ถามเกี่ยวกับ Green Office หรือ Carbon..."
      [disabled]="isLoading"
    ></textarea>
    <button class="chat-send-btn" (click)="sendMessage()" [disabled]="isLoading || !inputMessage.trim()">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>
</div>
