<!-- Floating Toggle Button -->
<button class="chat-fab" (click)="toggleChat()" [class.open]="isOpen" title="GreenBot AI Assistant">
  <i class="fa-solid" [ngClass]="isOpen ? 'fa-xmark' : 'fa-robot'"></i>
  <span class="chat-fab-pulse" *ngIf="!isOpen"></span>
</button>

<!-- Chat Panel -->
<div class="chat-panel" [class.open]="isOpen" [style.width.px]="chatWidth" [style.height.px]="chatHeight">
  
  <!-- Resize Handles -->
  <div class="resize-handle resize-top" (mousedown)="onResizeStart($event, 'top')"></div>
  <div class="resize-handle resize-left" (mousedown)="onResizeStart($event, 'left')"></div>
  <div class="resize-handle resize-top-left" (mousedown)="onResizeStart($event, 'top-left')"></div>

  <!-- Header -->
  <div class="chat-header">
    <div class="chat-header-info">
      <button class="chat-history-toggle" (click)="toggleHistory()" title="ประวัติการสนทนา">
        <i class="fa-solid fa-bars"></i>
      </button>
      <div class="chat-avatar bg-white p-[2px]">
        <img src="/assets/images/greenbot.png" alt="GreenBot" class="w-100 h-100 rounded-circle object-fit-cover">
      </div>
      <div>
        <p class="chat-title">GreenBot</p>
        <p class="chat-subtitle">AI ผู้ช่วยด้านสิ่งแวดล้อม</p>
      </div>
    </div>
    <button class="chat-clear-btn" (click)="startNewChat()" title="เริ่มบทสนทนาใหม่">
      <i class="fa-solid fa-plus"></i>
    </button>
  </div>

  <!-- History Drawer -->
  <div class="chat-history-drawer" [class.open]="showHistory">
    <div class="drawer-header">
      <span class="font-bold text-sm text-slate-800">ประวัติการสนทนา</span>
      <button (click)="toggleHistory()" class="text-slate-400 hover:text-slate-600 transition-colors">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="drawer-content">
      <div *ngIf="sessions.length === 0" class="text-center text-slate-400 text-xs py-4">
        ไม่มีประวัติการสนทนา
      </div>
      <div *ngFor="let s of sessions" 
           class="history-item d-flex align-items-center justify-content-between" 
           [class.active]="s.id === activeSessionId"
           (click)="selectSession(s)">
        <div class="d-flex align-items-center text-truncate pr-2">
          <i class="fa-regular fa-message mr-2 flex-shrink-0"></i>
          <span class="text-truncate">{{ s.title }}</span>
        </div>
        <button class="btn-delete-session-item ml-2" (click)="openDeleteSessionModal(s, $event)" title="ลบการสนทนานี้">
          <i class="fa-regular fa-trash-can"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-messages">
    <div *ngFor="let msg of messages" class="chat-message-wrapper" [ngClass]="msg.role">
      <div class="chat-bubble" [ngClass]="msg.role">
        <p>{{ msg.text }}</p>
      </div>
    </div>

    <!-- Loading indicator -->
    <div *ngIf="isLoading" class="chat-message-wrapper bot">
      <div class="chat-bubble bot loading-bubble">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="chat-input-area">
    <textarea
      class="chat-input"
      rows="1"
      [(ngModel)]="inputMessage"
      (keydown)="onKeyEnter($event)"
      placeholder="ถามเกี่ยวกับ Green Office หรือ Carbon..."
      [disabled]="isLoading"
    ></textarea>
    <button class="chat-send-btn" (click)="sendMessage()" [disabled]="isLoading || !inputMessage.trim()">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>
</div>

<!-- Custom Centered Modal Overlay -->
<div class="custom-modal-backdrop" *ngIf="showDeleteConfirmModal || showDeleteAllConfirmModal" (click)="cancelDelete()">
  <div class="custom-modal-content" (click)="$event.stopPropagation()">
    <div class="custom-modal-header text-center">
      <div class="modal-alert-icon mb-3">
        <i class="fa-solid fa-triangle-exclamation text-amber-500 fs-1"></i>
      </div>
      <h5 class="fw-black text-slate-800 mb-1 fs-5">ยืนยันการลบประวัติ</h5>
    </div>
    <div class="custom-modal-body text-center text-slate-500 text-xs my-3 leading-relaxed">
      <span *ngIf="showDeleteConfirmModal">คุณต้องการลบการสนทนานี้ใช่หรือไม่?<br>การลบจะไม่สามารถกู้คืนข้อมูลได้</span>
      <span *ngIf="showDeleteAllConfirmModal">คุณต้องการลบประวัติการสนทนาทั้งหมดใช่หรือไม่?<br>การลบจะไม่สามารถกู้คืนข้อมูลได้</span>
    </div>
    <div class="custom-modal-footer d-flex gap-2 justify-content-center mt-4">
      <button class="btn btn-light rounded-pill px-4 py-2 text-xs fw-bold border" (click)="cancelDelete()">ยกเลิก</button>
      <button class="btn btn-danger rounded-pill px-4 py-2 text-xs text-white fw-bold shadow-sm" (click)="confirmDelete()">ยืนยันการลบ</button>
    </div>
  </div>
</div>
